<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise Library</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('exercise-db-theme');
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <script src="data/exercises.js"></script>
  <script src="scripts/i18n.js"></script>
  <style>
    /* ── Reset ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    img { display: block; max-width: 100%; }
    input { font: inherit; }
    ol, ul { list-style: none; }

    /* ── Design Tokens ──────────────────────────────── */
    :root {
      color-scheme: dark;
      --bg-base:        #090b0d;
      --bg-surface:     #111519;
      --bg-elevated:    #191e23;
      --bg-input:       #151a1f;
      --border:         #252b31;
      --border-hover:   #3b444d;
      --accent:         #ff6b2c;
      --accent-strong:  #ff824f;
      --accent-muted:   rgba(255, 107, 44, 0.12);
      --text-primary:   #f7f8f8;
      --text-secondary: #a2abb4;
      --text-tertiary:  #68727c;
      --shadow-soft:    0 18px 60px rgba(0, 0, 0, 0.28);
      --radius-md:      10px;
      --radius-lg:      14px;
      --radius-xl:      18px;
      --sidebar-w:      292px;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg-base:        #f4f1ec;
      --bg-surface:     #ffffff;
      --bg-elevated:    #f2eee8;
      --bg-input:       #f7f4ef;
      --border:         #ded8cf;
      --border-hover:   #b9b1a7;
      --accent:         #df4f17;
      --accent-strong:  #f0642d;
      --accent-muted:   rgba(223, 79, 23, 0.1);
      --text-primary:   #181511;
      --text-secondary: #655f58;
      --text-tertiary:  #928a81;
      --shadow-soft:    0 18px 60px rgba(63, 47, 32, 0.16);
    }

    /* ── Base ───────────────────────────────────────── */
    html, body { height: 100%; }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ──────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }

    /* ── App Shell ──────────────────────────────────── */
    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────── */
    .sidebar {
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-surface);
      z-index: 1;
    }

    .sidebar-actions { display: flex; align-items: center; gap: 6px; }
    .language-select {
      width: 58px;
      height: 30px;
      padding: 0 5px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
      outline: none;
      cursor: pointer;
    }
    .language-select:hover,
    .language-select:focus-visible { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); }
    .theme-toggle {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 14px;
      transition: color .15s, border-color .15s, transform .15s;
    }
    .theme-toggle:hover, .theme-toggle:focus-visible { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); outline: none; }
    .mobile-filter-toggle {
      display: none;
      min-width: 38px;
      height: 30px;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 7px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
    }
    .mobile-filter-toggle svg { width: 14px; height: 14px; }
    .mobile-filter-count { min-width: 15px; color: var(--accent); font-size: 9px; font-weight: 800; }

    .sidebar-logo {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .sidebar-logo span {
      color: var(--accent);
    }

    .sidebar-body {
      padding: 12px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ── Search ─────────────────────────────────────── */
    .search-wrapper {
      position: relative;
      margin-bottom: 8px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      pointer-events: none;
      width: 14px;
      height: 14px;
    }

    .search-box {
      width: 100%;
      padding: 8px 32px 8px 32px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-box::placeholder { color: var(--text-tertiary); }
    .search-box:focus { border-color: var(--accent); }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 16px;
      line-height: 1;
      display: none;
      padding: 2px 4px;
    }

    .search-clear:hover { color: var(--text-primary); }
    .search-clear.visible { display: block; }

    /* ── Filter Sections ────────────────────────────── */
    .filter-section {
      position: relative;
      border-radius: var(--radius-md);
      overflow: visible;
    }

    .filter-dropdown-toggle {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 8px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(255, 255, 255, .018);
      color: var(--text-secondary);
      text-align: left;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .filter-dropdown-toggle:hover { border-color: var(--border-hover); background: var(--bg-elevated); }
    .filter-dropdown-toggle:focus-visible,
    .filter-section.open .filter-dropdown-toggle {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-muted);
      outline: none;
    }
    .filter-toggle-label {
      min-width: 78px;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 700;
    }
    .filter-toggle-value {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      color: var(--text-tertiary);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }
    .filter-section.has-selection .filter-toggle-value { color: var(--accent); }
    .filter-toggle-count {
      min-width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border-radius: 10px;
      background: var(--accent-muted);
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
    }
    .filter-toggle-count:empty { display: none; }
    .filter-toggle-chevron {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      transition: transform .15s;
    }
    .filter-section.open .filter-toggle-chevron { transform: rotate(180deg); }

    .filter-dropdown-panel {
      margin-top: 7px;
      padding: 8px;
      border: 1px solid var(--border-hover);
      border-radius: 12px;
      background: var(--bg-surface);
      box-shadow: var(--shadow-soft);
    }
    .filter-dropdown-panel[hidden] { display: none; }
    .filter-dropdown-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-bottom: 8px;
    }
    .filter-dropdown-search {
      width: 100%;
      min-width: 0;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 11px;
      outline: none;
    }
    .filter-dropdown-search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-muted); }
    .filter-dropdown-clear {
      flex: 0 0 auto;
      padding: 6px;
      color: var(--text-tertiary);
      font-size: 10px;
      font-weight: 700;
    }
    .filter-dropdown-clear:hover:not(:disabled) { color: var(--accent); }
    .filter-dropdown-clear:disabled { opacity: .35; cursor: default; }
    .filter-option-list {
      max-height: 240px;
      overflow-y: auto;
      display: grid;
      gap: 2px;
      padding-right: 2px;
    }
    .filter-option {
      min-height: 34px;
      display: grid;
      grid-template-columns: 17px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 6px 7px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      text-transform: capitalize;
    }
    .filter-option:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .filter-option.selected { background: var(--accent-muted); color: var(--accent); }
    .filter-option.unavailable:not(.selected) { opacity: .38; cursor: default; }
    .filter-option[hidden] { display: none; }
    .filter-option input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--accent);
    }
    .filter-option-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .filter-option-count {
      min-width: 24px;
      color: var(--text-tertiary);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .filter-empty {
      padding: 16px 8px;
      color: var(--text-tertiary);
      font-size: 11px;
      text-align: center;
    }
    .filter-empty[hidden] { display: none; }

    /* ── Main Content ───────────────────────────────── */
    .main-content {
      overflow-y: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Results Bar ────────────────────────────────── */
    .results-bar {
      padding: 14px 20px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      background: var(--bg-base);
      z-index: 2;
      border-bottom: 1px solid var(--border);
    }

    .results-count {
      font-size: 12px;
      color: var(--text-secondary);
      margin-right: auto;
    }

    .active-filters {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .active-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px 3px 10px;
      background: var(--accent-muted);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      text-transform: capitalize;
    }

    .active-badge-remove {
      font-size: 13px;
      line-height: 1;
      color: var(--accent);
      opacity: 0.7;
      transition: opacity 0.1s;
    }

    .active-badge-remove:hover { opacity: 1; }

    .clear-all {
      font-size: 11px;
      color: var(--text-secondary);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .clear-all:hover { color: var(--text-primary); }

    /* ── Exercise Grid ──────────────────────────────── */
    .grid-wrapper {
      padding: 16px 20px 32px;
      flex: 1;
    }

    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }

    /* ── Exercise Card ──────────────────────────────── */
    .exercise-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .exercise-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    .card-media {
      aspect-ratio: 3/4;
      background: var(--bg-elevated);
      overflow: hidden;
      position: relative;
    }

    .card-thumb,
    .card-gif {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.2s;
    }

    .card-gif { opacity: 0; }
    .exercise-card:hover .card-thumb { opacity: 0; }
    .exercise-card:hover .card-gif { opacity: 1; }

    .card-body {
      padding: 9px 11px 11px;
    }

    .card-name {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-primary);
      margin-bottom: 5px;
      text-transform: capitalize;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: capitalize;
      letter-spacing: 0.01em;
    }

    .tag-cat  { background: rgba(59, 130, 246, 0.12); color: #60a5fa; }
    .tag-equip { background: rgba(34, 197, 94, 0.10); color: #4ade80; }

    /* ── Load Sentinel ──────────────────────────────── */
    .load-sentinel {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    .load-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .load-spinner.visible { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Empty State ────────────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
    }

    .empty-state p:first-child {
      font-size: 32px;
      margin-bottom: 8px;
    }

    /* ── Modal ──────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      width: min(660px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      transform: translateY(10px) scale(0.98);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.open .modal-panel {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 0;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      text-transform: capitalize;
    }

    .modal-close {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      margin-top: 2px;
    }

    .modal-close:hover {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent);
    }

    .modal-media {
      padding: 14px 18px 0;
    }

    .modal-gif {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
    }

    .modal-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 20px;
      padding: 18px;
      border-top: 1px solid var(--border);
    }

    .detail-item {
      min-width: 0;
      padding-left: 11px;
      border-left: 2px solid var(--detail-accent, var(--accent));
    }

    .detail-item.body { --detail-accent: #60a5fa; }
    .detail-item.equipment { --detail-accent: #4ade80; }
    .detail-item.primary { --detail-accent: var(--accent); }
    .detail-item.secondary { --detail-accent: #c084fc; }

    .detail-label {
      margin-bottom: 3px;
      color: var(--text-tertiary);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .detail-value {
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.4;
      text-transform: capitalize;
    }

    .modal-instructions {
      padding: 0 18px 22px;
    }

    .modal-instructions-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      padding: 14px 0 0;
      display: block;
    }

    .instruction-language {
      min-height: 42px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) 14px;
      align-items: center;
      gap: 10px;
      margin: 10px 0 14px;
      padding: 0 11px 0 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--bg-elevated);
      transition: border-color .15s, box-shadow .15s;
    }

    .instruction-language:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-muted);
    }

    .instruction-language::after {
      content: '⌄';
      color: var(--text-tertiary);
      font-size: 15px;
      line-height: 1;
      pointer-events: none;
    }

    .instruction-language-label {
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 700;
    }

    .instruction-language-select {
      width: 100%;
      min-width: 0;
      height: 40px;
      padding: 0;
      appearance: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      text-align: right;
      cursor: pointer;
    }

    .instruction-language-select option {
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    .instructions-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .instruction-step {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .step-num {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .step-text {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 768px) {
      /* Layout */
      .app-shell {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: 100dvh;
      }

      /* Sidebar → top panel */
      .sidebar {
        height: auto;
        max-height: 45vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
        overflow-y: auto;
      }

      .sidebar-header {
        padding: 14px 14px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .sidebar-body {
        padding: 10px 12px 16px;
        gap: 10px;
      }

      .search-wrapper { margin-bottom: 4px; }

      .filter-section { width: 100%; }
      .filter-option-list { max-height: 210px; }

      /* Main */
      .main-content { height: auto; flex: 1; overflow-y: auto; }

      .results-bar { padding: 10px 14px 8px; }

      .grid-wrapper { padding: 12px 12px 28px; }

      .exercise-grid {
        grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
        gap: 10px;
      }

      /* Modal → bottom sheet */
      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .modal-panel {
        width: 100%;
        max-height: 92dvh;

    .grid-wrapper { padding: 22px 32px 42px; }
    .exercise-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }

    .exercise-card {
      position: relative;

    .card-preview {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 2;
      padding: 5px 8px;
      border-radius: 8px;

    .card-name { min-height: 37px; margin-bottom: 10px; font-size: 14px; font-weight: 680; line-height: 1.35; }

    .tag { padding: 3px 7px; border-radius: 6px; }
    .tag-cat { background: rgba(87, 159, 255, .12); color: #83b7ff; }
    .tag-equip { background: rgba(68, 211, 142, .1); color: #70dba7; }
    .tag-target { background: rgba(192, 132, 252, .11); color: #cda0fa; }

    .modal-overlay { background: rgba(2, 3, 4, .76); }
    .modal-panel {
      width: min(960px, 100%);
      height: min(760px, calc(100dvh - 40px));
      max-height: none;
      display: grid;
      grid-template-columns: minmax(280px, .85fr) minmax(340px, 1.15fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      border-color: #333a41;
      box-shadow: var(--shadow-soft);
    }
    .modal-header { grid-column: 1 / -1; padding: 22px 24px 18px; border-bottom: 1px solid var(--border); }
    .modal-title { font-size: 22px; letter-spacing: -.025em; }
    .modal-header-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .modal-media { grid-column: 1; grid-row: 2 / span 2; min-height: 0; padding: 22px; overflow-y: auto; border-right: 1px solid var(--border); }
    .modal-gif { max-height: none; aspect-ratio: 1; object-fit: cover; background: #e8e8e6; border-radius: 14px; }
    .modal-navigation { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .modal-nav-button {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 10px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .15s, border-color .15s;

    .modal-nav-button:last-child { text-align: right; }
    .modal-nav-button:hover, .modal-nav-button:focus-visible { color: var(--text-primary); border-color: var(--accent); outline: none; }
    .modal-nav-button:disabled { opacity: .4; cursor: not-allowed; }
    .modal-instructions {
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 14px 18px 22px;
      overflow: hidden;
    }
    .modal-instructions-label { padding-top: 22px; }
    .modal-details { grid-column: 2; grid-row: 3; padding: 18px 22px 22px; }
    .instructions-list {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 8px;
      scrollbar-gutter: stable;
    }
    .instruction-step { gap: 12px; }
    .step-num { width: 24px; height: 24px; color: var(--accent); border-color: rgba(255,107,44,.35); background: var(--accent-muted); }

    @media (max-width: 900px) {

      .catalog-metric { display: none; }
      .results-bar { padding: 11px 16px; }
      .explorer-controls { width: 100%; order: 2; margin-left: 0; }

      .explorer-controls::-webkit-scrollbar { display: none; }
      .control-button { flex: 0 0 auto; justify-content: center; }
      .sort-select { flex: 0 0 128px; min-width: 0; }
      .grid-wrapper { padding: 16px 14px 30px; }
      .exercise-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .modal-overlay {
        align-items: stretch;
        padding: 0;
      }
      .modal-panel {
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;

        overflow-y: auto;

        border: 0;
        border-radius: 0;

      .modal-header {

        flex: 0 0 auto;

        border-bottom: 1px solid var(--border);

      .modal-title {
        width: auto;
        min-width: 0;
        flex: 1;
        font-size: 18px;
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .modal-header-actions {
        order: initial;
        width: auto;
        flex: 0 0 auto;
        margin-left: 0;

      .modal-close { width: 36px; height: 36px; margin-top: 0; }

      .modal-instructions {
        order: 1;
        display: block;
        flex: 0 0 auto;
        min-height: auto;
        padding: 0 16px 24px;
        overflow: visible;
        border-bottom: 1px solid var(--border);
      }
      .modal-instructions-label {
        padding-top: 18px;
        font-size: 11px;
      }
      .instruction-language { margin: 12px 0 18px; }
      .instructions-list {
        gap: 14px;
        overflow: visible;
        padding-right: 0;
      }
      .instruction-step { gap: 12px; }
      .step-num { width: 26px; height: 26px; margin-top: 0; }
      .step-text {
        min-width: 0;

        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      .modal-media {

        flex: 0 0 auto;

        max-height: none;
        aspect-ratio: auto;

      }

      .modal-details {

        grid-template-columns: repeat(2, minmax(0, 1fr));

    @media (max-width: 480px) {

      .catalog-description { font-size: 12px; }
      .exercise-grid { gap: 10px; }
      .card-body { padding: 11px; }

      .modal-details { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {

      .card-gif { display: none; }
      .exercise-card:hover .card-thumb, .exercise-card:focus-visible .card-thumb { opacity: 1; }
    }

  </style>
</head>

<div class="app-shell">

        <button class="control-button" id="random-exercise" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 4h2.2c3.8 0 3.8 8 7.6 8H14"/><path d="m11.5 9.5 2.5 2.5-2.5 2.5"/><path d="M2 12h2.2c1.4 0 2.3-1.1 3.1-2.5M8.8 6.5c.8-1.4 1.7-2.5 3-2.5H14"/><path d="m11.5 1.5 2.5 2.5-2.5 2.5"/>
          </svg>
          <span data-i18n="surpriseMe">Surprise me</span>
        </button>
        <select class="sort-select" id="sort-exercises" aria-label="Sort exercises">
          <option value="name-asc" data-i18n="nameAsc">Name A–Z</option>
          <option value="name-desc" data-i18n="nameDesc">Name Z–A</option>
          <option value="category" data-i18n="bodyPart">Body part</option>
          <option value="equipment" data-i18n="equipment">Equipment</option>
        </select>
      </div>
    </div>
    <div class="grid-wrapper">
      <div class="exercise-grid" id="exercise-grid"></div>
      <div class="load-sentinel" id="load-sentinel">
        <div class="load-spinner" id="load-spinner"></div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-panel" id="modal-panel">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-header-actions">
        <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="modal-media">
      <img class="modal-gif" id="modal-gif" alt="" />
      <div class="modal-navigation" aria-label="Exercise navigation">
        <button class="modal-nav-button" id="modal-previous" type="button">← Previous</button>
        <button class="modal-nav-button" id="modal-next" type="button">Next →</button>
      </div>
    </div>
    <div class="modal-instructions" id="modal-instructions"></div>
    <dl class="modal-details" id="modal-details"></dl>
  </div>
</div>

<script>
  const EXERCISES = window.EXERCISES_DATA;
  const { languages: UI_LANGUAGES, translations: UI_TRANSLATIONS, taxonomy: TAXONOMY_TRANSLATIONS } = window.ExerciseI18n;

  // ── State ──────────────────────────────────────────
  const state = {
    exercises: [],
    filtered: [],
    search: '',
    filters: {
      category: new Set(),
      equipment: new Set(),
      target: new Set(),
    },
    sort: 'name-asc',
    language: 'en',
    page: 0,
    pageSize: 60,
  };

  // ── DOM Refs ───────────────────────────────────────
  const gridEl        = document.getElementById('exercise-grid');
  const sentinelEl    = document.getElementById('load-sentinel');
  const spinnerEl     = document.getElementById('load-spinner');
  const countEl       = document.getElementById('results-count');
  const activeFilEl   = document.getElementById('active-filters');
  const searchEl      = document.getElementById('search');
  const searchClearEl = document.getElementById('search-clear');
  const sidebarEl     = document.querySelector('.sidebar');
  const mobileFilterToggleEl = document.getElementById('mobile-filter-toggle');
  const mobileFilterCountEl = document.getElementById('mobile-filter-count');
  const languageSelectEl = document.getElementById('language-select');
  const themeToggleEl = document.getElementById('theme-toggle');
  const sortEl        = document.getElementById('sort-exercises');
  const randomEl      = document.getElementById('random-exercise');
  const modalOverlay  = document.getElementById('modal-overlay');
  const modalTitle    = document.getElementById('modal-title');
  const modalGif      = document.getElementById('modal-gif');
  const modalDetails  = document.getElementById('modal-details');
  const modalInstr    = document.getElementById('modal-instructions');
  const modalClose    = document.getElementById('modal-close');
  const modalPanel    = document.getElementById('modal-panel');
  const modalPrevious = document.getElementById('modal-previous');
  const modalNext     = document.getElementById('modal-next');
  let modalTrigger    = null;
  let currentModalId  = null;

  // ── Utility ────────────────────────────────────────
  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  function capitalize(str) {
    return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
  }

  function uniqueSorted(arr) {
    return [...new Set(arr)].sort();
  }

  function t(key, variables = {}) {
    const template = UI_TRANSLATIONS[state.language]?.[key] ?? UI_TRANSLATIONS.en[key] ?? key;
    return template.replace(/\{(\w+)\}/g, (_, name) => variables[name] ?? `{${name}}`);
  }

  function formatNumber(value) {
    return new Intl.NumberFormat(state.language).format(value);
  }

  function exerciseLabel(count) {
    return t(count === 1 ? 'exerciseSingular' : 'exercisePlural');
  }

  function localizeTaxonomy(value) {
    if (!value || state.language === 'en') return value || '';
    return TAXONOMY_TRANSLATIONS[state.language]?.[String(value).toLowerCase()] ?? value;
  }

  function applyStaticTranslations() {
    document.documentElement.lang = state.language;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(element => {
      const count = element.dataset.i18nCount;
      element.textContent = t(element.dataset.i18n, count ? { count: formatNumber(Number(count)) } : {});
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
      element.placeholder = t(element.dataset.i18nPlaceholder);
    });

    languageSelectEl.value = state.language;
    languageSelectEl.setAttribute('aria-label', t('language'));
    searchEl.setAttribute('aria-label', t('searchExercises'));
    searchClearEl.setAttribute('aria-label', t('clearSearch'));
    document.querySelector('[data-filter-search="category"]').setAttribute('aria-label', t('searchCategories'));
    document.querySelector('[data-filter-search="equipment"]').setAttribute('aria-label', t('searchEquipment'));
    document.querySelector('[data-filter-search="target"]').setAttribute('aria-label', t('searchMuscles'));
    document.querySelector('.catalog-metric').setAttribute('aria-label', t('availableExercises', { count: formatNumber(state.exercises.length) }));
    document.querySelector('.explorer-controls').setAttribute('aria-label', t('displayControls'));
    sortEl.setAttribute('aria-label', t('sortExercises'));
    modalClose.setAttribute('aria-label', t('close'));
    document.querySelector('.modal-navigation').setAttribute('aria-label', t('exerciseNavigation'));
  }

  function changeLanguage(language) {
    if (!Object.hasOwn(UI_LANGUAGES, language) || language === state.language) return;
    state.language = language;
    try { localStorage.setItem('exercise-db-language', language); } catch { /* private mode fallback */ }
    closeFilterDropdowns();
    applyStaticTranslations();
    updateThemeToggle();
    rebuildSearchIndex();
    buildFilterOptions();
    applyFilters();
    if (currentModalId && modalOverlay.classList.contains('open')) openModal(currentModalId);
  }

  function updateThemeToggle() {
    const current = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    themeToggleEl.textContent = current === 'dark' ? '☀' : '☾';
    const label = t('switchTheme', { theme: t(next === 'light' ? 'lightTheme' : 'darkTheme') });
    themeToggleEl.setAttribute('aria-label', label);
    themeToggleEl.title = label;
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('exercise-db-theme', theme); } catch { /* private mode fallback */ }
    updateThemeToggle();
  }

  function hydrateStateFromUrl() {
    const params = new URLSearchParams(location.search);
    state.search = params.get('q') || '';

    let storedLanguage = '';
    try { storedLanguage = localStorage.getItem('exercise-db-language') || ''; } catch { /* private mode fallback */ }
    const browserLanguage = (navigator.language || 'en').split('-')[0].toLowerCase();
    const requestedLanguage = params.get('lang') || storedLanguage || browserLanguage;
    state.language = Object.hasOwn(UI_LANGUAGES, requestedLanguage) ? requestedLanguage : 'en';

    for (const key of ['category', 'equipment', 'target']) {
      const values = params.get(key);
      if (values) state.filters[key] = new Set(values.split(',').filter(Boolean));
    }

    const sort = params.get('sort');
    if (['name-asc', 'name-desc', 'category', 'equipment'].includes(sort)) state.sort = sort;
  }

  function modalCollection() {
    return state.filtered.some(exercise => exercise.id === currentModalId) ? state.filtered : state.exercises;
  }

  function updateModalControls(exercise) {
    if (!exercise) return;
    const collection = modalCollection();
    const index = collection.findIndex(item => item.id === exercise.id);
    const previous = collection[(index - 1 + collection.length) % collection.length];
    const next = collection[(index + 1) % collection.length];
    const canNavigate = collection.length > 1 && index >= 0;
    modalPrevious.disabled = !canNavigate;
    modalNext.disabled = !canNavigate;
    modalPrevious.textContent = canNavigate ? `← ${previous.name}` : `← ${t('previous')}`;
    modalNext.textContent = canNavigate ? `${next.name} →` : `${t('next')} →`;
    modalPrevious.title = canNavigate ? t('previousNamed', { name: previous.name }) : '';
    modalNext.title = canNavigate ? t('nextNamed', { name: next.name }) : '';
  }

  function navigateModal(offset) {
    const collection = modalCollection();
    if (collection.length < 2) return;
    const index = collection.findIndex(exercise => exercise.id === currentModalId);
    if (index < 0) return;
    const nextIndex = (index + offset + collection.length) % collection.length;
    openModal(collection[nextIndex].id);
  }

  function syncUrl() {
    const params = new URLSearchParams();
    params.set('lang', state.language);
    if (state.search.trim()) params.set('q', state.search.trim());
    for (const key of ['category', 'equipment', 'target']) {
      if (state.filters[key].size) params.set(key, [...state.filters[key]].join(','));
    }
    if (state.sort !== 'name-asc') params.set('sort', state.sort);
    const query = params.toString();
    const nextUrl = `${location.pathname}${query ? `?${query}` : ''}${location.hash}`;
    try { history.replaceState(null, '', nextUrl); } catch { /* file:// fallback */ }
  }

  function setExerciseHash(id = '') {
    const nextHash = id ? `#exercise-${id}` : '';
    const nextUrl = `${location.pathname}${location.search}${nextHash}`;
    try { history.replaceState(null, '', nextUrl); } catch { /* file:// fallback */ }
  }

  function updateDisplayControls() {
    sortEl.value = state.sort;
    const activeFilterCount = ['category', 'equipment', 'target']
      .reduce((total, key) => total + state.filters[key].size, 0)
      + (state.search.trim() ? 1 : 0);
    const mobileFiltersOpen = sidebarEl.classList.contains('filters-open');
    mobileFilterCountEl.textContent = formatNumber(activeFilterCount);
    mobileFilterToggleEl.setAttribute('aria-expanded', String(mobileFiltersOpen));
    const filterAction = t(mobileFiltersOpen ? 'hideFilters' : 'showFilters');
    const activeLabel = activeFilterCount ? `, ${t('activeCount', { count: formatNumber(activeFilterCount) })}` : '';
    mobileFilterToggleEl.setAttribute('aria-label', `${filterAction}${activeLabel}`);
  }

  function rebuildSearchIndex() {
    state.exercises.forEach(exercise => {
      exercise._idx = [
        exercise.name,
        exercise.category,
        exercise.target,
        exercise.equipment,
        exercise.muscle_group,
        localizeTaxonomy(exercise.category),
        localizeTaxonomy(exercise.target),
        localizeTaxonomy(exercise.equipment),
        localizeTaxonomy(exercise.muscle_group),
      ].join(' ').toLowerCase();
    });
  }

  // ── Data Loading ───────────────────────────────────
  function init() {
    state.exercises = EXERCISES;
    hydrateStateFromUrl();

    rebuildSearchIndex();

    buildFilterOptions();
    applyStaticTranslations();
    updateThemeToggle();
    searchEl.value = state.search;
    searchClearEl.classList.toggle('visible', state.search.length > 0);
    updateDisplayControls();
    applyFilters();
    wireEvents();

    const hashMatch = location.hash.match(/^#exercise-(\d{4})$/);
    if (hashMatch) requestAnimationFrame(() => openModal(hashMatch[1]));
  }

  // ── Build Filter Dropdowns ─────────────────────────
  function buildFilterOptions() {
    const sortLocalized = values => uniqueSorted(values)
      .sort((a, b) => localizeTaxonomy(a).localeCompare(localizeTaxonomy(b), state.language, { sensitivity: 'base' }));
    const cats = sortLocalized(state.exercises.map(e => e.category));
    const equips = sortLocalized(state.exercises.map(e => e.equipment));
    const targets = sortLocalized(state.exercises.map(e => e.target));

    renderFilterOptions('category-options', cats, 'category');
    renderFilterOptions('equipment-options', equips, 'equipment');
    renderFilterOptions('target-options', targets, 'target');
  }

  function renderFilterOptions(containerId, values, filterKey) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    values.forEach(value => container.appendChild(makeFilterOption(value, filterKey)));

    const empty = document.createElement('div');
    empty.className = 'filter-empty';
    empty.dataset.filterEmpty = filterKey;
    empty.textContent = t('noMatchingOptions');
    empty.hidden = true;
    container.appendChild(empty);
  }

  function makeFilterOption(value, filterKey) {
    const option = document.createElement('label');
    option.className = 'filter-option';
    option.dataset.filterRow = filterKey;
    option.dataset.value = value;

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.dataset.filterOption = filterKey;
    checkbox.value = value;
    checkbox.checked = state.filters[filterKey].has(value);
    const label = document.createElement('span');
    label.className = 'filter-option-name';
    label.textContent = localizeTaxonomy(value);
    const count = document.createElement('span');
    count.className = 'filter-option-count';
    count.setAttribute('aria-hidden', 'true');
    option.append(checkbox, label, count);
    return option;
  }

  function closeFilterDropdowns(except = null) {
    document.querySelectorAll('[data-filter-section]').forEach(section => {
      if (section === except) return;
      section.classList.remove('open');
      section.querySelector('[data-filter-toggle]').setAttribute('aria-expanded', 'false');
      section.querySelector('.filter-dropdown-panel').hidden = true;
      const search = section.querySelector('[data-filter-search]');
      if (search.value) {
        search.value = '';
        searchFilterOptions(section.dataset.filterSection, '');
      }
    });
  }

  function setFilterDropdown(section, open) {
    if (open) closeFilterDropdowns(section);
    section.classList.toggle('open', open);
    section.querySelector('[data-filter-toggle]').setAttribute('aria-expanded', String(open));
    section.querySelector('.filter-dropdown-panel').hidden = !open;
    if (open) requestAnimationFrame(() => section.querySelector('[data-filter-search]').focus());
  }

  function searchFilterOptions(filterKey, query) {
    const normalized = query.trim().toLowerCase();
    let visible = 0;
    document.querySelectorAll(`[data-filter-row="${filterKey}"]`).forEach(row => {
      const matches = `${row.dataset.value} ${localizeTaxonomy(row.dataset.value)}`.toLowerCase().includes(normalized);
      row.hidden = !matches;
      if (matches) visible += 1;
    });
    document.querySelector(`[data-filter-empty="${filterKey}"]`).hidden = visible !== 0;
  }

  function updateFilterSummaries() {
    for (const key of ['category', 'equipment', 'target']) {
      const selected = [...state.filters[key]];
      const section = document.querySelector(`[data-filter-section="${key}"]`);
      const summary = section.querySelector(`[data-filter-summary="${key}"]`);
      const count = section.querySelector(`[data-filter-selected-count="${key}"]`);
      const clear = section.querySelector(`[data-filter-clear="${key}"]`);
      const toggle = section.querySelector(`[data-filter-toggle="${key}"]`);
      summary.textContent = selected.length === 0
        ? t(key === 'target' ? 'anyMuscle' : 'any')
        : (selected.length === 1 ? capitalize(localizeTaxonomy(selected[0])) : t('multiple'));
      count.textContent = selected.length ? formatNumber(selected.length) : '';
      clear.disabled = selected.length === 0;
      section.classList.toggle('has-selection', selected.length > 0);
      toggle.setAttribute('aria-label', `${toggle.querySelector('.filter-toggle-label').textContent}: ${selected.length ? t('selected', { count: formatNumber(selected.length) }) : t('any')}`);
    }
  }

  // ── Filter Logic ───────────────────────────────────
  function matchesActiveFilters(exercise, excludedFilter = null) {
    const q = state.search.toLowerCase().trim();
    if (q && !exercise._idx.includes(q)) return false;
    for (const key of ['category', 'equipment', 'target']) {
      if (key === excludedFilter) continue;
      if (state.filters[key].size && !state.filters[key].has(exercise[key])) return false;
    }
    return true;
  }

  function updateFilterCounts() {
    document.querySelectorAll('[data-filter-option]').forEach(input => {
      const filter = input.dataset.filterOption;
      const { value } = input;
      const count = state.exercises.reduce((total, exercise) => (
        matchesActiveFilters(exercise, filter) && exercise[filter] === value ? total + 1 : total
      ), 0);
      const active = state.filters[filter].has(value);
      const row = input.closest('.filter-option');
      row.querySelector('.filter-option-count').textContent = formatNumber(count);
      row.classList.toggle('selected', active);
      row.classList.toggle('unavailable', count === 0 && !active);
      input.checked = active;
      input.disabled = count === 0 && !active;
      input.setAttribute('aria-label', `${localizeTaxonomy(value)}: ${formatNumber(count)} ${exerciseLabel(count)}`);
    });
    updateFilterSummaries();
  }

  function applyFilters() {
    const filtered = state.exercises.filter(exercise => matchesActiveFilters(exercise));

    const compareName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
    const sorters = {
      'name-asc': compareName,
      'name-desc': (a, b) => compareName(b, a),
      category: (a, b) => localizeTaxonomy(a.category).localeCompare(localizeTaxonomy(b.category), state.language) || compareName(a, b),
      equipment: (a, b) => localizeTaxonomy(a.equipment).localeCompare(localizeTaxonomy(b.equipment), state.language) || compareName(a, b),
    };
    state.filtered = filtered.sort(sorters[state.sort]);

    state.page = 0;
    renderGrid();
    updateResultsBar();
    updateActiveBadges();
    updateFilterCounts();
    updateDisplayControls();
    syncUrl();
  }

  // ── Rendering ──────────────────────────────────────
  function renderGrid() {
    gridEl.innerHTML = '';
    const slice = state.filtered.slice(0, state.pageSize);

    if (slice.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `<p>🔍</p><p>${t('noExercises')}</p>`;
      gridEl.appendChild(empty);
      spinnerEl.classList.remove('visible');
      return;
    }

    const frag = document.createDocumentFragment();
    slice.forEach(ex => frag.appendChild(createCard(ex)));
    gridEl.appendChild(frag);

    const hasMore = state.filtered.length > state.pageSize;
    spinnerEl.classList.toggle('visible', hasMore);
  }

  function appendNextPage() {
    state.page++;
    const start = state.page * state.pageSize;
    const end   = start + state.pageSize;
    const slice = state.filtered.slice(start, end);
    if (slice.length === 0) return;

    const frag = document.createDocumentFragment();
    slice.forEach(ex => frag.appendChild(createCard(ex)));
    gridEl.appendChild(frag);

    const hasMore = end < state.filtered.length;
    spinnerEl.classList.toggle('visible', hasMore);
  }

  function createCard(ex) {
    const article = document.createElement('article');
    article.className = 'exercise-card';
    article.dataset.id = ex.id;
    article.tabIndex = 0;
    article.setAttribute('role', 'button');
    article.setAttribute('aria-label', t('viewExercise', { name: ex.name }));

    // Media
    const media = document.createElement('div');
    media.className = 'card-media';

    const thumb = document.createElement('img');
    thumb.className = 'card-thumb';
    thumb.src = ex.image;
    thumb.alt = ex.name;
    thumb.loading = 'lazy';

    const gif = document.createElement('img');
    gif.className = 'card-gif';
    gif.dataset.src = ex.gif_url;
    gif.alt = '';

    const previewBadge = document.createElement('span');
    previewBadge.className = 'card-preview';
    previewBadge.textContent = t('preview');

    media.appendChild(thumb);
    media.appendChild(gif);
    media.appendChild(previewBadge);

    // Body
    const body = document.createElement('div');
    body.className = 'card-body';

    const name = document.createElement('h3');
    name.className = 'card-name';
    name.textContent = ex.name;

    const tags = document.createElement('div');
    tags.className = 'card-tags';

    const catTag = document.createElement('span');
    catTag.className = 'tag tag-cat';
    catTag.textContent = localizeTaxonomy(ex.category);

    const equipTag = document.createElement('span');
    equipTag.className = 'tag tag-equip';
    equipTag.textContent = localizeTaxonomy(ex.equipment);

    const targetTag = document.createElement('span');
    targetTag.className = 'tag tag-target';
    targetTag.textContent = localizeTaxonomy(ex.target);

    tags.appendChild(catTag);
    tags.appendChild(equipTag);
    tags.appendChild(targetTag);
    body.appendChild(name);
    body.appendChild(tags);
    article.appendChild(media);
    article.appendChild(body);

    return article;
  }

  // ── Results Bar ────────────────────────────────────
  function updateResultsBar() {
    const total = state.filtered.length;
    const all   = state.exercises.length;
    countEl.textContent = total === all
      ? `${formatNumber(all)} ${exerciseLabel(all)}`
      : t('resultsPartial', { count: formatNumber(total), all: formatNumber(all), label: exerciseLabel(all) });
  }

  function updateActiveBadges() {
    activeFilEl.innerHTML = '';
    const { category, equipment, target } = state.filters;
    let hasAny = false;

    const addBadges = (set, key) => {
      set.forEach(val => {
        hasAny = true;
        const localizedValue = localizeTaxonomy(val);
        const badge = document.createElement('span');
        badge.className = 'active-badge';
        badge.innerHTML = `${localizedValue}<button class="active-badge-remove" data-filter="${key}" data-value="${val}" aria-label="${t('removeFilter', { value: localizedValue })}">×</button>`;
        activeFilEl.appendChild(badge);
      });
    };

    addBadges(category,  'category');
    addBadges(equipment, 'equipment');
    addBadges(target,    'target');

    if (hasAny) {
      const clearAll = document.createElement('button');
      clearAll.className = 'clear-all';
      clearAll.textContent = t('clearAll');
      clearAll.addEventListener('click', clearAllFilters);
      activeFilEl.appendChild(clearAll);
    }
  }

  function clearAllFilters() {
    state.filters.category.clear();
    state.filters.equipment.clear();
    state.filters.target.clear();
    state.search = '';
    searchEl.value = '';
    searchClearEl.classList.remove('visible');
    applyFilters();
  }

  // ── Modal ──────────────────────────────────────────
  function openModal(id) {
    const ex = state.exercises.find(e => e.id === id);
    if (!ex) return;
    const wasOpen = modalOverlay.classList.contains('open');

    currentModalId = ex.id;
    setExerciseHash(ex.id);

    modalTitle.textContent = ex.name;
    modalGif.src = ex.gif_url;
    modalGif.alt = ex.name;

    // Exercise details
    const primaryMuscles = ex.target ? [ex.target] : [];
    const secondaryRaw = ex.secondary_muscles || (ex.muscle_group ? [ex.muscle_group] : []);
    const secondaryMuscles = secondaryRaw.filter(m => m !== ex.target);
    const detailItems = [
      { type: 'body', label: t('bodyPart'), values: [ex.body_part || ex.category] },
      { type: 'equipment', label: t('equipment'), values: [ex.equipment] },
      { type: 'primary', label: t('primaryMuscle'), values: primaryMuscles },
      { type: 'secondary', label: t('secondaryMuscles'), values: secondaryMuscles },
    ];

    modalDetails.innerHTML = '';
    detailItems.forEach(({ type, label, values }) => {
      const item = document.createElement('div');
      item.className = `detail-item ${type}`;

      const term = document.createElement('dt');
      term.className = 'detail-label';
      term.textContent = label;

      const description = document.createElement('dd');
      description.className = 'detail-value';
      description.textContent = values.length
        ? values.map(localizeTaxonomy).join(' · ')
        : '—';

      item.appendChild(term);
      item.appendChild(description);
      modalDetails.appendChild(item);
    });

    // Instructions — format is always keyed by language code
    modalInstr.innerHTML = '';
    const LANG_LABELS = { en: 'English', es: 'Español', it: 'Italiano', tr: 'Türkçe', ru: 'Русский', zh: '简体中文', hi: 'हिन्दी', pl: 'Polski', ko: '한국어', fr: 'Français' };
    const langs = ['en', 'es', 'it', 'tr', 'ru', 'zh', 'hi', 'pl', 'ko', 'fr']
      .map(code => ({ code, steps: ex.instruction_steps?.[code] ?? [] }))
      .filter(l => l.steps.length > 0);

    if (langs.length > 0) {
      const instrLabel = document.createElement('span');
      instrLabel.className = 'modal-instructions-label';
      instrLabel.textContent = t('instructions');
      modalInstr.appendChild(instrLabel);

      const list = document.createElement('ol');
      list.className = 'instructions-list';

      function renderSteps(steps) {
        list.innerHTML = '';
        list.scrollTop = 0;
        steps.forEach((step, i) => {
          const li = document.createElement('li');
          li.className = 'instruction-step';
          li.innerHTML = `<span class="step-num">${i + 1}</span><span class="step-text">${step}</span>`;
          list.appendChild(li);
        });
      }

      if (langs.length > 1) {
        const preferredInstructionLanguage = ['en', 'es', 'fr', 'it'].includes(state.language) ? state.language : 'en';
        const preferredIndex = Math.max(0, langs.findIndex(language => language.code === preferredInstructionLanguage));

        const languageControl = document.createElement('label');
        languageControl.className = 'instruction-language';

        const languageLabel = document.createElement('span');
        languageLabel.className = 'instruction-language-label';
        languageLabel.textContent = t('instructionLanguage');

        const languageSelect = document.createElement('select');
        languageSelect.className = 'instruction-language-select';
        languageSelect.setAttribute('aria-label', t('instructionLanguage'));

        langs.forEach(({ code }) => {
          const option = document.createElement('option');
          option.value = code;
          option.textContent = LANG_LABELS[code] ?? code;
          languageSelect.appendChild(option);
        });

        languageSelect.value = langs[preferredIndex].code;
        languageSelect.addEventListener('change', () => {
          const selectedLanguage = langs.find(language => language.code === languageSelect.value);
          if (selectedLanguage) renderSteps(selectedLanguage.steps);
        });

        languageControl.appendChild(languageLabel);
        languageControl.appendChild(languageSelect);
        modalInstr.appendChild(languageControl);

        renderSteps(langs[preferredIndex].steps);
      } else {
        renderSteps(langs[0].steps);
      }
      modalInstr.appendChild(list);
    }

    updateModalControls(ex);
    modalPanel.scrollTop = 0;
    modalPanel.querySelector('.modal-media').scrollTop = 0;

    modalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (!wasOpen) modalClose.focus();
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
    document.body.style.overflow = '';
    modalGif.src = '';
    setExerciseHash();
    currentModalId = null;
    if (modalTrigger) modalTrigger.focus();
    modalTrigger = null;
  }

  // ── Events ─────────────────────────────────────────
  function wireEvents() {
    // Search
    searchEl.addEventListener('input', debounce(() => {
      state.search = searchEl.value;
      searchClearEl.classList.toggle('visible', state.search.length > 0);
      applyFilters();
    }, 250));

    searchClearEl.addEventListener('click', () => {
      searchEl.value = '';
      state.search = '';
      searchClearEl.classList.remove('visible');
      applyFilters();
    });

    themeToggleEl.addEventListener('click', () => {
      const current = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    languageSelectEl.addEventListener('change', () => changeLanguage(languageSelectEl.value));

    mobileFilterToggleEl.addEventListener('click', () => {
      sidebarEl.classList.toggle('filters-open');
      if (!sidebarEl.classList.contains('filters-open')) closeFilterDropdowns();
      updateDisplayControls();
      if (sidebarEl.classList.contains('filters-open')) searchEl.focus();
    });

    sortEl.addEventListener('change', () => {
      state.sort = sortEl.value;
      applyFilters();
    });

    modalPrevious.addEventListener('click', () => navigateModal(-1));
    modalNext.addEventListener('click', () => navigateModal(1));

    randomEl.addEventListener('click', () => {
      if (!state.filtered.length) return;
      const exercise = state.filtered[Math.floor(Math.random() * state.filtered.length)];
      modalTrigger = randomEl;
      openModal(exercise.id);
    });

    // Compact multiselect filters
    document.querySelector('.sidebar-body').addEventListener('click', e => {
      const toggle = e.target.closest('[data-filter-toggle]');
      if (toggle) {
        const section = toggle.closest('[data-filter-section]');
        setFilterDropdown(section, !section.classList.contains('open'));
        return;
      }

      const clear = e.target.closest('[data-filter-clear]');
      if (!clear) return;
      state.filters[clear.dataset.filterClear].clear();
      applyFilters();
    });

    document.querySelector('.sidebar-body').addEventListener('change', e => {
      const option = e.target.closest('[data-filter-option]');
      if (!option) return;
      const filter = option.dataset.filterOption;
      if (option.checked) state.filters[filter].add(option.value);
      else state.filters[filter].delete(option.value);
      applyFilters();
    });

    document.querySelector('.sidebar-body').addEventListener('input', e => {
      const filterSearch = e.target.closest('[data-filter-search]');
      if (filterSearch) searchFilterOptions(filterSearch.dataset.filterSearch, filterSearch.value);
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('[data-filter-section]')) closeFilterDropdowns();
    });

    // Remove active badge
    activeFilEl.addEventListener('click', e => {
      const btn = e.target.closest('.active-badge-remove');
      if (!btn) return;
      const { filter, value } = btn.dataset;
      state.filters[filter].delete(value);
      applyFilters();
    });

    // Card hover → load GIF
    gridEl.addEventListener('mouseover', e => {
      const card = e.target.closest('.exercise-card');
      if (!card) return;
      const gif = card.querySelector('.card-gif');
      if (gif && gif.dataset.src && !gif.src) {
        gif.src = gif.dataset.src;
      }
    });

    // Card click → modal
    gridEl.addEventListener('click', e => {
      const card = e.target.closest('.exercise-card');
      if (card) {
        modalTrigger = card;
        openModal(card.dataset.id);
      }
    });

    gridEl.addEventListener('keydown', e => {
      const card = e.target.closest('.exercise-card');
      if (!card || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      modalTrigger = card;
      openModal(card.dataset.id);
    });

    // Modal close
    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e => {
      if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (modalOverlay.classList.contains('open')) closeModal();
        else if (document.querySelector('[data-filter-section].open')) {
          const openSection = document.querySelector('[data-filter-section].open');
          const toggle = openSection.querySelector('[data-filter-toggle]');
          closeFilterDropdowns();
          toggle.focus();
        }
        else if (sidebarEl.classList.contains('filters-open')) {
          sidebarEl.classList.remove('filters-open');
          updateDisplayControls();
          mobileFilterToggleEl.focus();
        }
      }
      if (modalOverlay.classList.contains('open') && !e.target.matches('input, textarea, select')) {
        if (e.key === 'ArrowLeft') navigateModal(-1);
        if (e.key === 'ArrowRight') navigateModal(1);
      }
      if (e.key !== 'Tab' || !modalOverlay.classList.contains('open')) return;

      const focusable = [...modalPanel.querySelectorAll('button:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')];
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });

    // Infinite scroll
    const observer = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting && spinnerEl.classList.contains('visible')) {
        appendNextPage();
      }
    }, { rootMargin: '200px' });
    observer.observe(sentinelEl);
  }


  // ── Boot ───────────────────────────────────────────
  init();
</script>
</body>
